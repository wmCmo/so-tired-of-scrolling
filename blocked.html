<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not today</title>
    <link rel="icon" href="icons/icon-32.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --fg: #ecedef;
        --muted: #9a9ea6;
        --accent: #ff4d4d;
        --button: #26282c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 520px;
        padding: 32px 24px;
        text-align: center;
      }
      .face {
        display: block;
        width: 96px;
        height: 96px;
        margin: 0 auto 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        letter-spacing: -0.02em;
      }
      .count {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .count strong {
        color: var(--accent);
        font-size: 20px;
      }
      .question {
        margin: 0 0 28px;
        font-size: 18px;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        background: var(--button);
        color: var(--fg);
      }
      button.primary {
        background: var(--fg);
        color: var(--bg);
        font-weight: 600;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="face" src="icons/face.svg" alt="" />
      <h1>Not today.</h1>
      <p class="count"><span id="what">Shorts</span> tries today: <strong id="count">–</strong></p>
      <p class="question">What were you about to do before you opened this?</p>
      <div class="actions">
        <button class="primary" id="close">Close this tab</button>
        <button id="watch" disabled>Watch just this one (10)</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
